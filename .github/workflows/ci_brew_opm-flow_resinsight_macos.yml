name: Install OPM Flow and ResInsight in macOS using brew

on:
  pull_request:

jobs:
  install-resinsight-flow-macOS-local:
    permissions:
        contents: read
    timeout-minutes: 120
    runs-on: macos-26
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

    steps:
      - uses: actions/checkout@v5

      - name: Tap local Homebrew repo (PR version)
        run: |
          brew tap cssr-tools/opm $PWD
          brew trust cssr-tools/opm

      - name: Install OPM Flow (from PR)
        run: |
          brew install opm-simulators -y
          which flow

      - name: Run OPM Flow (parallel)
        run: |
          curl -O https://raw.githubusercontent.com/OPM/opm-tests/master/spe1/SPE1CASE1.DATA
          mpirun -np 2 flow SPE1CASE1.DATA --output-dir=flow_spe1case1

      - name: Check if OPM Flow succeeded
        run: |
          file="$PWD/flow_spe1case1/SPE1CASE1.UNRST"
          if [[ -f "$file" ]]; then
            echo "The installation of OPM Flow succeeded"
          else
            echo "The installation of OPM Flow failed"
            exit 1
          fi

      - name: Install ResInsight (from PR)
        run: |
          brew install resinsight -y
          which resinsight
